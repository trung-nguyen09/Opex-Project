<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>High Risk Zone — Dashboard</title>
<link rel="icon" href="icon.png">
<style>
:root{--navy:#1a1a2e;--navy2:#16213e;--blue:#3b82f6;--green:#16a34a;--gl:#dcfce7;--red:#dc2626;--rl:#fee2e2;--bg:#f0f2f5;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:#1a1a2e;min-height:100vh;}

.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:18px 32px 0;}
.hdr-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.hdr-icon{font-size:26px;}
.hdr-title h1{font-size:19px;font-weight:700;}
.hdr-title p{font-size:12px;color:#8899bb;margin-top:2px;}
.vtabs{display:flex;}
.vtab{padding:10px 28px;font-size:14px;font-weight:600;cursor:pointer;border:none;
  background:transparent;color:#8899bb;border-bottom:3px solid transparent;transition:all .15s;}
.vtab:hover{color:#fff;}
.vtab.active{color:#fff;border-bottom-color:var(--blue);}

.nav{background:#fff;padding:12px 32px;display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);flex-wrap:wrap;}
.nav-arr{display:flex;align-items:center;gap:8px;}
.nav-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid #e5e7eb;
  background:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;
  justify-content:center;transition:all .15s;}
.nav-btn:hover{background:#f0f2f5;border-color:var(--blue);}
.nav-lbl{font-size:15px;font-weight:700;min-width:210px;text-align:center;}
.nav-today{padding:6px 14px;border-radius:8px;background:var(--navy);
  color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;}
.zone-filters{display:flex;gap:6px;margin-left:8px;}
.zf{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
  border:1.5px solid #e5e7eb;background:#fff;color:#555;transition:all .15s;}
.zf:hover{border-color:var(--blue);}
.zf.zactive{background:var(--navy);color:#fff;border-color:var(--navy);}
.srch{position:relative;margin-left:auto;}
.srch input{padding:8px 12px 8px 34px;border:1.5px solid #e5e7eb;border-radius:8px;
  font-size:13px;outline:none;width:230px;transition:border-color .2s;}
.srch input:focus{border-color:var(--blue);}
.srch .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  font-size:14px;color:#aaa;pointer-events:none;}

.stats{display:flex;gap:14px;padding:20px 32px 0;flex-wrap:wrap;}
.stat{background:#fff;border-radius:12px;padding:14px 24px;text-align:center;
  box-shadow:0 1px 6px rgba(0,0,0,.07);flex:1;min-width:100px;max-width:190px;}
.stat .num{font-size:30px;font-weight:800;}
.stat .lbl{font-size:11px;color:#888;margin-top:3px;text-transform:uppercase;letter-spacing:.6px;}
.s-tot .num{color:var(--navy);}
.s-ok  .num{color:var(--green);}
.s-bad .num{color:var(--red);}
.s-rt  .num{color:var(--blue);font-size:22px;}

.content{padding:20px 32px 48px;}

table{width:100%;border-collapse:separate;border-spacing:0 4px;}
thead th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:#888;padding:0 14px 6px;}
tbody tr{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .15s;}
tbody tr:hover{box-shadow:0 3px 10px rgba(0,0,0,.12);}
tbody tr.ok {border-left:4px solid var(--green);}
tbody tr.bad{border-left:4px solid var(--red);}
td{padding:10px 14px;font-size:13px;vertical-align:middle;}
td:first-child{border-radius:10px 0 0 10px;width:44px;color:#ccc;font-size:12px;}
td:last-child{border-radius:0 10px 10px 0;}
.em{font-family:monospace;font-size:12.5px;color:#374151;}
.sid{font-family:monospace;font-size:11px;color:var(--blue);font-weight:700;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;
  border-radius:20px;font-size:12px;font-weight:700;}
.bok {background:var(--gl);color:var(--green);}
.bbad{background:var(--rl);color:var(--red);}
.zone-tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;
  font-weight:700;margin-right:3px;background:#e0f2fe;color:#0369a1;}
.empty-msg{text-align:center;color:#ccc;padding:50px;font-size:14px;}

.wcard{background:#fff;border-radius:14px;padding:24px;
  box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:20px;}
.wcard-title{font-size:14px;font-weight:700;color:#374151;margin-bottom:20px;}
.chart-bars{display:flex;gap:10px;align-items:flex-end;}
.bg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
.bg-top{font-size:11px;color:#aaa;height:20px;display:flex;align-items:center;margin-bottom:2px;}
.bars-row{display:flex;gap:3px;align-items:flex-end;justify-content:center;}
.bar{width:20px;border-radius:4px 4px 0 0;min-height:4px;position:relative;cursor:default;}
.bar:hover::after{content:attr(data-v);position:absolute;top:-28px;left:50%;
  transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:3px 8px;
  border-radius:5px;font-size:11px;white-space:nowrap;z-index:10;}
.bok-bar {background:var(--green);}
.bbad-bar{background:var(--red);}
.bg-lbl{font-size:11px;font-weight:600;text-align:center;margin-top:6px;color:#555;}
.bg-sub{font-size:10px;color:#bbb;text-align:center;}
.legend{display:flex;gap:16px;margin-top:16px;}
.li{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;}
.ld{width:10px;height:10px;border-radius:2px;}

.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:20px;}
.wdc{background:#fff;border-radius:10px;padding:12px 8px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center;}
.wdc.wtoday{border:2px solid var(--blue);}
.wdc-dow{font-size:13px;font-weight:700;margin-bottom:2px;}
.wdc-dt{font-size:10px;color:#aaa;margin-bottom:10px;}
.wdc-ok {font-size:18px;font-weight:800;color:var(--green);}
.wdc-bad{font-size:18px;font-weight:800;color:var(--red);}
.wdc-l{font-size:9px;color:#bbb;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.wdc-nd{font-size:11px;color:#ccc;margin-top:10px;}

.cal-wrap{background:#fff;border-radius:14px;padding:24px;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.cal-m-title{font-size:16px;font-weight:800;color:#1a1a2e;margin-bottom:16px;}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.cal-dh{text-align:center;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;padding:4px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cc{background:#f9fafb;border-radius:8px;padding:8px;min-height:72px;
  border:1.5px solid #f0f2f5;transition:all .15s;}
.cc.chas{background:#fff;cursor:pointer;}
.cc.chas:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(59,130,246,.15);}
.cc.ctoday{border-color:var(--blue);background:#eff6ff;}
.cc.cempty{background:transparent;border-color:transparent;min-height:0;}
.cc-d{font-size:12px;font-weight:700;color:#374151;margin-bottom:6px;}
.ctoday .cc-d{color:var(--blue);}
.c-ok-bar {background:var(--green);height:4px;border-radius:3px;margin-bottom:2px;}
.c-bad-bar{background:var(--red);  height:4px;border-radius:3px;margin-bottom:2px;}
.c-nums{display:flex;justify-content:space-between;font-size:10px;margin-top:4px;}
.c-nok {color:var(--green);font-weight:700;}
.c-nbad{color:var(--red);  font-weight:700;}
.c-nodata{font-size:10px;color:#ddd;margin-top:8px;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-icon">🔐</div>
    <div class="hdr-title">
      <h1>High Risk Zone — Dashboard</h1>
    </div>
  </div>
  <div class="vtabs">
    <button class="vtab active" onclick="switchView('daily',this)">📅 Ngày</button>
    <button class="vtab" onclick="switchView('weekly',this)">📊 Tuần</button>
    <button class="vtab" onclick="switchView('monthly',this)">📆 Tháng</button>
  </div>
</div>

<div class="nav">
  <div class="nav-arr">
    <button class="nav-btn" onclick="navigate(-1)">&#8249;</button>
    <div class="nav-lbl" id="navLbl">—</div>
    <button class="nav-btn" onclick="navigate(1)">&#8250;</button>
  </div>
  <button class="nav-today" onclick="goLatest()">Mới nhất</button>
  <div class="zone-filters">
    <button class="zf zactive" onclick="setZone('all',this)">Tất cả</button>
    <button class="zf" onclick="setZone('A3',this)">A3</button>
    <button class="zf" onclick="setZone('A4',this)">A4</button>
    <button class="zf" onclick="setZone('B1',this)">B1</button>
    <button class="zf" onclick="setZone('B2',this)">B2</button>
  </div>
  <div class="srch" id="srchWrap">
    <span class="si">🔍</span>
    <input type="text" id="srch" placeholder="Tìm email, tên, Staff ID..." oninput="render()"/>
  </div>
</div>

<div class="stats" id="statsBar"></div>
<div class="content" id="main"></div>

const allLogs  = _DATA.logs;
const allowed  = _DATA.allowed;

const LATEST = Object.keys(allLogs).sort().pop();
const TODAY_STR = '2026-08-14';
const DOW_S  = ['CN','T2','T3','T4','T5','T6','T7'];
const DOW_F  = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const MON_VI = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6',
                'Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];

let view   = 'daily';
let cursor = new Date(LATEST);
let zoneFilter = 'all';

function toDS(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmt(d) { return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }

function switchView(v, btn) {
  view = v;
  document.querySelectorAll('.vtab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('srchWrap').style.display = v==='daily' ? '' : 'none';
  render();
}
function navigate(d) {
  if (view==='daily')       cursor.setDate(cursor.getDate()+d);
  else if(view==='weekly')  cursor.setDate(cursor.getDate()+d*7);
  else                      cursor.setMonth(cursor.getMonth()+d);
  render();
}
function goLatest() { cursor = new Date(LATEST); render(); }
function setZone(z, btn) {
  zoneFilter = z;
  document.querySelectorAll('.zf').forEach(b=>b.classList.remove('zactive'));
  btn.classList.add('zactive');
  render();
}

function filterEntries(entries) {
  if (zoneFilter === 'all') return entries;
  return entries.filter(e => e.zones.includes(zoneFilter));
}

function render() {
  if      (view==='daily')   renderDaily();
  else if (view==='weekly')  renderWeekly();
  else                       renderMonthly();
}

function setStats(items) {
  document.getElementById('statsBar').innerHTML = items.map(s=>
    `<div class="stat ${s.cls}"><div class="num">${s.n}</div><div class="lbl">${s.l}</div></div>`
  ).join('');
}

// ── DAILY ─────────────────────────────────────────────────────
function renderDaily() {
  const ds = toDS(cursor);
  const raw = allLogs[ds] || [];
  const entries = filterEntries(raw);
  const q = document.getElementById('srch').value.toLowerCase().trim();
  const filtered = entries.filter(r =>
    !q || r.email.toLowerCase().includes(q) || r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q)
  );
  const nOk  = entries.filter(r=>r.ok).length;
  const nBad = entries.filter(r=>!r.ok).length;

  const isLatest = ds === LATEST;
  document.getElementById('navLbl').textContent =
    DOW_F[cursor.getDay()]+', '+fmt(cursor)+'/'+cursor.getFullYear()+
    (isLatest ? ' — Mới nhất' : '');

  setStats([
    {cls:'s-tot', n:entries.length,  l:'Tổng người'},
    {cls:'s-ok',  n:nOk,             l:'✓ Đúng'},
    {cls:'s-bad', n:nBad,            l:'✗ Sai'},
    {cls:'s-rt',  n:entries.length ? Math.round(nOk/entries.length*100)+'%':'—', l:'Tỷ lệ đúng'},
  ]);

  if (!filtered.length) {
    document.getElementById('main').innerHTML =
      `<div class="empty-msg">${!raw.length ? '📭 Không có dữ liệu ngày này.' : '🔍 Không tìm thấy kết quả.'}</div>`;
    return;
  }

  const rows = filtered.map((r,i) => {
    const zoneTags = r.zones.map(z=>`<span class="zone-tag">${z}</span>`).join('');
    return `<tr class="${r.ok?'ok':'bad'}">
      <td>${i+1}</td>
      <td class="em">${r.email}</td>
      <td>${r.id ? `<span class="sid">${r.id}</span>` : '<span style="color:#ddd">—</span>'}</td>
      <td>${r.name||'<span style="color:#ccc">—</span>'}</td>
      <td>${zoneTags}</td>
      <td><span class="badge ${r.ok?'bok':'bbad'}">${r.ok?'✔ Đúng':'✘ Sai'}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <table>
      <thead><tr>
        <th>#</th><th>Email</th><th>Staff ID</th><th>Tên nhân viên</th><th>Zone</th><th>Trạng thái</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── WEEKLY ────────────────────────────────────────────────────
function weekStart(d) {
  const dow = d.getDay();
  const ws  = new Date(d);
  ws.setDate(d.getDate()-(dow===0?6:dow-1));
  return ws;
}

function renderWeekly() {
  const ws = weekStart(new Date(cursor));
  const we = new Date(ws); we.setDate(ws.getDate()+6);
  document.getElementById('navLbl').textContent = fmt(ws)+' — '+fmt(we)+'/'+we.getFullYear();

  const days = Array.from({length:7},(_,i)=>{
    const d  = new Date(ws); d.setDate(ws.getDate()+i);
    const ds = toDS(d);
    const e  = filterEntries(allLogs[ds]||[]);
    return {d, ds, nOk:e.filter(r=>r.ok).length, nBad:e.filter(r=>!r.ok).length, total:e.length, hasData:!!allLogs[ds]};
  });

  const totOk  = days.reduce((s,d)=>s+d.nOk,0);
  const totBad = days.reduce((s,d)=>s+d.nBad,0);
  const tot    = totOk+totBad;
  setStats([
    {cls:'s-tot',n:tot,    l:'Tổng / tuần'},
    {cls:'s-ok', n:totOk,  l:'✓ Đúng'},
    {cls:'s-bad',n:totBad, l:'✗ Sai'},
    {cls:'s-rt', n:tot?Math.round(totOk/tot*100)+'%':'—', l:'Tỷ lệ đúng'},
  ]);

  const maxV = Math.max(...days.map(d=>d.total),1);
  const H    = 130;
  const bars = days.map(d=>{
    const isL  = d.ds===LATEST;
    const hOk  = d.nOk  ? Math.max(Math.round(d.nOk /maxV*H),6):0;
    const hBad = d.nBad ? Math.max(Math.round(d.nBad/maxV*H),6):0;
    return `<div class="bg">
      <div class="bg-top">${d.total||''}</div>
      <div class="bars-row">
        <div class="bar bok-bar"  style="height:${hOk}px"  data-v="Đúng: ${d.nOk}"></div>
        <div class="bar bbad-bar" style="height:${hBad}px" data-v="Sai: ${d.nBad}"></div>
      </div>
      <div class="bg-lbl" style="${isL?'color:var(--blue)':''}">${DOW_S[d.d.getDay()]}</div>
      <div class="bg-sub">${fmt(d.d)}</div>
    </div>`;
  }).join('');

  const cards = days.map(d=>{
    const isL = d.ds===LATEST;
    return `<div class="wdc${isL?' wtoday':''}">
      <div class="wdc-dow" style="${isL?'color:var(--blue)':''}">${DOW_S[d.d.getDay()]}</div>
      <div class="wdc-dt">${fmt(d.d)}</div>
      ${d.hasData
        ? `<div class="wdc-ok">${d.nOk}</div><div class="wdc-l">Đúng</div>
           <div class="wdc-bad">${d.nBad}</div><div class="wdc-l">Sai</div>`
        : `<div class="wdc-nd">No data</div>`}
    </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="wcard">
      <div class="wcard-title">Biểu đồ truy cập trong tuần</div>
      <div class="chart-bars" style="height:${H+60}px">${bars}</div>
      <div class="legend">
        <div class="li"><div class="ld" style="background:var(--green)"></div>Đúng (được phép)</div>
        <div class="li"><div class="ld" style="background:var(--red)"></div>Sai (không được phép)</div>
      </div>
    </div>
    <div class="wdays">${cards}</div>`;
}

// ── MONTHLY ───────────────────────────────────────────────────
function renderMonthly() {
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById('navLbl').textContent = MON_VI[m]+' '+y;

  const dim = new Date(y,m+1,0).getDate();
  let totOk=0, totBad=0;
  for(let d=1;d<=dim;d++){
    const ds = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const e = filterEntries(allLogs[ds]||[]);
    totOk  += e.filter(r=>r.ok).length;
    totBad += e.filter(r=>!r.ok).length;
  }
  const tot = totOk+totBad;
  setStats([
    {cls:'s-tot',n:tot,    l:'Tổng / tháng'},
    {cls:'s-ok', n:totOk,  l:'✓ Đúng'},
    {cls:'s-bad',n:totBad, l:'✗ Sai'},
    {cls:'s-rt', n:tot?Math.round(totOk/tot*100)+'%':'—', l:'Tỷ lệ đúng'},
  ]);

  const fd     = new Date(y,m,1).getDay();
  const offset = fd===0?6:fd-1;
  let cells    = Array.from({length:offset},()=>'<div class="cc cempty"></div>').join('');

  for(let d=1;d<=dim;d++){
    const ds   = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const e    = filterEntries(allLogs[ds]||[]);
    const has  = !!allLogs[ds];
    const nOk  = e.filter(r=>r.ok).length;
    const nBad = e.filter(r=>!r.ok).length;
    const isL  = ds===LATEST;
    const wOk  = nOk  ? Math.max(Math.round(nOk /110*100),10):0;
    const wBad = nBad ? Math.max(Math.round(nBad/110*100),10):0;
    cells += `<div class="cc ${isL?'ctoday':''} ${has?'chas':''}">
      <div class="cc-d">${d}</div>
      ${nOk  ?`<div class="c-ok-bar"  style="width:${wOk}%"></div>` :''}
      ${nBad ?`<div class="c-bad-bar" style="width:${wBad}%"></div>`:''}
      ${has  ?`<div class="c-nums">
        <span class="c-nok">${nOk ?'✓'+nOk :''}</span>
        <span class="c-nbad">${nBad?'✗'+nBad:''}</span>
      </div>`:`<div class="c-nodata">—</div>`}
    </div>`;
  }

  document.getElementById('main').innerHTML = `
    <div class="cal-wrap">
      <div class="cal-m-title">${MON_VI[m]} ${y}</div>
      <div class="cal-dow-row">
        ${['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<div class="cal-dh">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="legend" style="margin-top:16px">
        <div class="li"><div class="ld" style="background:var(--green)"></div>Đúng (được phép)</div>
        <div class="li"><div class="ld" style="background:var(--red)"></div>Sai (không được phép)</div>
      </div>
    </div>`;
}

render();
</script>
</body>
</html>
